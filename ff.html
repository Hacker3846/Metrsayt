<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncTxt | Dev-Buffer</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --success: #238636;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title::before {
            content: "</>";
            color: var(--accent);
            font-family: monospace;
            font-weight: bold;
        }

        .status {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .status-dot.online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.syncing { background-color: var(--accent); box-shadow: 0 0 8px var(--accent); }

        textarea {
            width: 100%;
            height: 60vh;
            background: #010409;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            background: var(--card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            border-color: var(--text-muted);
            background: var(--border);
        }

        button.primary {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        @media (max-width: 600px) {
            textarea { height: 50vh; }
            body { padding: 10px; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="title">SyncTxt</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Подключение...</span>
        </div>
    </div>

    <textarea id="syncArea" placeholder="Вставь код или текст сюда. Он автоматически появится на других устройствах..."></textarea>

    <div class="controls">
        <button onclick="clearText()">Очистить</button>
        <button onclick="pasteText()" id="pasteBtn">Вставить</button>
        <button class="primary" onclick="copyText()" id="copyBtn">Копировать</button>
    </div>
</div>

<script>
    // Конфигурация Firebase из твоего кода
    const firebaseConfig = { databaseURL: "https://messengerb-dcc80-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // Создаем отдельную ветку для буфера обмена
    const textRef = database.ref('shared_buffer/main_text');

    const textarea = document.getElementById('syncArea');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const copyBtn = document.getElementById('copyBtn');

    let isTyping = false;
    let typingTimer;

    // Слушаем изменения из базы в реальном времени
    textRef.on('value', (snap) => {
        statusDot.classList.add('online');
        statusText.textContent = "Синхронизировано";
        
        // Обновляем текст, только если мы сейчас сами его не печатаем
        if (!isTyping) {
            const val = snap.val();
            textarea.value = val || "";
        }
    });

    // Отправляем изменения в базу при вводе
    textarea.addEventListener('input', () => {
        isTyping = true;
        statusDot.className = 'status-dot syncing';
        statusText.textContent = "Сохранение...";

        clearTimeout(typingTimer);
        
        // Ждем 500мс после последней нажатой клавиши перед отправкой
        typingTimer = setTimeout(() => {
            textRef.set(textarea.value).then(() => {
                isTyping = false;
                statusDot.className = 'status-dot online';
                statusText.textContent = "Синхронизировано";
            }).catch(err => {
                statusText.textContent = "Ошибка сохранения";
                console.error(err);
            });
        }, 500);
    });

    // Очистка БД и поля
    function clearText() {
        if(confirm("Точно очистить буфер для всех устройств?")) {
            textarea.value = "";
            textRef.set("");
            textarea.focus();
        }
    }

    // Вставка из буфера: очищает поле, вставляет текст, клавиатуру не открывает
    async function pasteText() {
        const pasteBtn = document.getElementById('pasteBtn');
        const originalText = pasteBtn.textContent;
        try {
            const text = await navigator.clipboard.readText();

            // Отменяем отложенную отправку, чтобы она не перезаписала новый текст
            clearTimeout(typingTimer);
            isTyping = false;

            textarea.value = "";      // сначала очищаем
            textarea.value = text;    // затем вставляем
            textarea.blur();          // фокус не даём -> клавиатура не появится

            statusDot.className = 'status-dot syncing';
            statusText.textContent = "Сохранение...";
            await textRef.set(text);
            statusDot.className = 'status-dot online';
            statusText.textContent = "Синхронизировано";

            pasteBtn.textContent = "Вставлено!";
        } catch (err) {
            console.error(err);
            pasteBtn.textContent = "Нет доступа к буферу";
        }
        setTimeout(() => { pasteBtn.textContent = originalText; }, 2000);
    }

    // Удобное копирование в 1 клик
    function copyText() {
        textarea.select();
        document.execCommand('copy');
        
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "Скопировано!";
        copyBtn.style.background = "var(--success)";
        copyBtn.style.borderColor = "var(--success)";
        
        setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.style.background = "";
            copyBtn.style.borderColor = "";
        }, 2000);
    }
</script>

</body>
</html>
